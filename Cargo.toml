[package]
name = "uu-linux-kernel-wlan"
version = "0.1.0"
edition = "2024"
description = "Инъекция 802.11 кадров и управление WLAN через nl80211"
repository = "https://github.com/UU-0665D27/uu-linux-kernel-wlan"
license = "MIT OR Apache-2.0"

[features]
default = []
tracing = ["dep:tracing", "uu-linux-kernel-netlink/tracing"]

[dependencies]
libc = "0.2"
thiserror = "2"
tracing = { version = "0.1", optional = true }
uu-linux-kernel-netlink = { git = "https://github.com/UU-0665D27/uu-linux-kernel-netlink", branch = "main" }
uu-wlan-wps-pin-gen = { git = "https://github.com/UU-0665D27/uu-wlan-wps-pin-gen", branch = "main" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
perf = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
